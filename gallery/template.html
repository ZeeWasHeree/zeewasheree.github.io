<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeee | Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header" style="justify-content: space-between; position: relative; padding-bottom: 0;">
        <a href="../index.html" class="icon-btn" style="text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back</a>
        <button id="theme-toggle" class="icon-btn"><i class="fa-solid fa-moon"></i></button>
    </header>

    <main>
        <section class="seamless-section" style="padding-top: 40px; text-align: center;">
            <h1 class="font-avalance highlight" style="font-size: 3rem; margin-bottom: 10px;">Valorant Gallery</h1>
            <p style="opacity: 0.7; font-weight: 600; margin-bottom: 40px;">Rank: Immortal | Role: Initiator</p>

            <div class="gallery-grid">
                <div class="gallery-item"><img src="./img/game1.jpg" alt="Gameplay 1"></div>
                <div class="gallery-item"><img src="./img/game2.jpg" alt="Gameplay 2"></div>
                <div class="gallery-item"><img src="./img/game3.jpg" alt="Gameplay 3"></div>
                <div class="gallery-item"><img src="./img/game4.jpg" alt="Gameplay 4"></div>
                <div class="gallery-item"><img src="./img/game5.jpg" alt="Gameplay 5"></div>
                <div class="gallery-item"><img src="./img/game6.jpg" alt="Gameplay 6"></div>
            </div>
        </section>
    </main>

    <footer class="seamless-section footer">
        <p>Made with love by Zeee</p>
    </footer>

    <script type="module" src="../script.js"></script>
</body>
</html>
